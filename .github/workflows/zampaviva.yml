name: ZampaViva TikTok

# Due video al giorno, in cloud: prima girava solo dal PC di Davide
# (run_zampaviva.bat). Dal 19/10/2026 i video arrivano su Telegram senza
# notifica e si accumulano; la domenica sera arriva il riepilogo con
# gli orari, e Davide li programma tutti insieme su TikTok Studio; in piu', se c'e' BLOB_READ_WRITE_TOKEN, una copia pubblica
# finisce in cronologia e la stanza degli agenti puo' proporla a Davide per
# TikTok. Il .bat funziona ancora per i video fatti a mano.

on:
  schedule:
    # GitHub fa partire le run schedulate in ritardo, anche di ore: non e'
    # un orario di pubblicazione, solo "una volta al mattino". Minuto 23 per
    # evitare lo scoccare dell'ora, quando GitHub e' piu' carico.
    - cron: '23 5 * * *'          # circa 7:23 italiane (ora legale)
    - cron: '23 15 * * *'         # circa 17:23: secondo video, prodotto diverso (rotazione)
    - cron: '0 17 * * 0'          # domenica: riepilogo della settimana (niente video)
  workflow_dispatch:
    inputs:
      prodotto:
        description: 'Handle o parola del prodotto (vuoto = rotazione)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: zampaviva
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa FFmpeg e font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Cache modello Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-${{ vars.WHISPER_MODEL || 'base' }}

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Genera il video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # Codice sconto in didascalia: sparisce da solo dopo la scadenza.
          CODICE_SCONTO: ${{ vars.CODICE_SCONTO || 'BENVENUTO10' }}
          CODICE_SCONTO_SCADENZA: ${{ vars.CODICE_SCONTO_SCADENZA || '2026-12-12' }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'base' }}
          GROQ_MODELLI: ${{ vars.GROQ_MODELLI }}
          # Passato via env e non interpolato nel comando: evita script injection
          PRODOTTO: ${{ inputs.prodotto }}
          EVENTO_ORARIO: ${{ github.event.schedule }}
        run: |
          if [ "$EVENTO_ORARIO" = "0 17 * * 0" ]; then
            python main.py --riepilogo
          else
            python main.py $PRODOTTO
          fi

      - name: Salva la cronologia
        # Solo se il video e' riuscito: una lavorazione caduta non deve
        # lasciare in memoria un prodotto mai mostrato.
        if: success()
        run: |
          git config --global user.name "ZampaViva Bot"
          git config --global user.email "bot@zampaviva.local"
          git add cronologia_zampaviva.json
          git diff --cached --quiet && exit 0
          git commit -m "Cronologia ZampaViva [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Avvisa su Telegram se la lavorazione cade
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDIRIZZO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ] && exit 0
          curl -sS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ZampaViva - ERRORE nella lavorazione del video: ${INDIRIZZO}" || true
